# Shared configuration using YAML anchors
x-common-config: &common-config
  volumes:
    - .:/workspace
    - uv-cache:/root/.cache/uv
    - renv-cache:/workspace/renv
  environment:
    - LLVM_CONFIG=/usr/bin/llvm-config-20
    - CMAKE_PREFIX_PATH=/usr/lib/llvm-20
    - JAVA_TOOL_OPTIONS=-Djava.awt.headless=true
  stdin_open: true
  tty: true

x-dev-build: &dev-build
  context: .
  dockerfile: docker/Dockerfile.dev

x-prod-build: &prod-build
  context: .
  dockerfile: docker/Dockerfile.prod

services:
  # Development environment — CPU only
  dev-cpu:
    <<: *common-config
    image: ghcr.io/collaborativebioinformatics/oncolearn:dev-cpu
    profiles: ["dev-cpu"]
    build:
      <<: *dev-build
      args:
        GPU_EXTRA: cpu
      target: dev
    container_name: oncolearn-dev-cpu

  # Development environment — NVIDIA GPU
  dev-cuda:
    <<: *common-config
    image: ghcr.io/collaborativebioinformatics/oncolearn:dev-cuda
    profiles: ["dev-cuda"]
    build:
      <<: *dev-build
      args:
        GPU_EXTRA: cu130
      target: dev
    container_name: oncolearn-dev-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: cuda
              count: all
              capabilities: [gpu]

  # Development environment — AMD GPU (native Linux)
  dev-rocm:
    <<: *common-config
    image: ghcr.io/collaborativebioinformatics/oncolearn:dev-rocm
    profiles: ["dev-rocm"]
    build:
      <<: *dev-build
      args:
        GPU_EXTRA: rocm
      target: dev
    container_name: oncolearn-dev-rocm
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video

  # Development environment — AMD GPU (WSL2)
  # Uses the same image as dev-rocm; WSL2 differences are runtime-only.
  dev-rocm-wsl:
    <<: *common-config
    image: ghcr.io/collaborativebioinformatics/oncolearn:dev-rocm
    profiles: ["dev-rocm-wsl"]
    build:
      <<: *dev-build
      args:
        GPU_EXTRA: rocm
      target: dev
    container_name: oncolearn-dev-rocm-wsl
    volumes:
      - .:/workspace
      - uv-cache:/root/.cache/uv
      - renv-cache:/workspace/renv
      - /usr/lib/wsl:/usr/lib/wsl:ro          # WSL GPU libraries
      - /opt/rocm/lib:/opt/rocm/lib:ro         # ROCm runtime libs (libroctx64, etc.)
    environment:
      - LLVM_CONFIG=/usr/bin/llvm-config-20
      - CMAKE_PREFIX_PATH=/usr/lib/llvm-20
      - JAVA_TOOL_OPTIONS=-Djava.awt.headless=true
      - LD_LIBRARY_PATH=/opt/rocm/lib:/usr/lib/wsl/lib
      - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
    devices:
      - /dev/dxg  # WSL2 DirectX Graphics device for GPU passthrough
    group_add:
      - video
    cap_add:
      - SYS_PTRACE  # required for ROCm GPU topology discovery
    security_opt:
      - seccomp:unconfined  # required for ROCm HSA runtime
    ipc: host  # required for ROCm shared memory
    shm_size: '2gb'

  # Production image — CPU only
  prod-cpu:
    image: ghcr.io/collaborativebioinformatics/oncolearn:prod-cpu
    profiles: ["prod-cpu"]
    build:
      <<: *prod-build
      args:
        GPU_EXTRA: cpu
      target: pytorch-prod
    container_name: oncolearn-prod-cpu
    volumes:
      - ./data:/workspace/data:ro
      - ./data/configs:/workspace/data/configs

  # Production image — NVIDIA GPU
  prod-cuda:
    image: ghcr.io/collaborativebioinformatics/oncolearn:prod-cuda
    profiles: ["prod-cuda"]
    build:
      <<: *prod-build
      args:
        GPU_EXTRA: cu130
      target: pytorch-prod
    container_name: oncolearn-prod-cuda
    volumes:
      - ./data:/workspace/data:ro
      - ./data/configs:/workspace/data/configs
    deploy:
      resources:
        reservations:
          devices:
            - driver: cuda
              count: all
              capabilities: [gpu]

  # Production image — AMD GPU (native Linux)
  prod-rocm:
    image: ghcr.io/collaborativebioinformatics/oncolearn:prod-rocm
    profiles: ["prod-rocm"]
    build:
      <<: *prod-build
      args:
        GPU_EXTRA: rocm
        ROCM_WSL: "0"
      target: pytorch-prod
    container_name: oncolearn-prod-rocm
    volumes:
      - ./data:/workspace/data:ro
      - ./data/configs:/workspace/data/configs
      - ./models:/workspace/models
      - ./outputs:/workspace/outputs
      - ./.hf-cache:/root/.cache/huggingface
      - ./src:/workspace/src
      - /opt/rocm/lib:/opt/rocm/lib:ro  # ROCm runtime libs
    environment:
      - LD_LIBRARY_PATH=/opt/rocm/lib
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ipc: host
    shm_size: '2gb'

  # Production image — AMD GPU (WSL2)
  # Uses a separate image with ROCm 7.2 LW wheels built for /dev/dxg.
  prod-rocm-wsl:
    image: ghcr.io/collaborativebioinformatics/oncolearn:prod-rocm-wsl
    profiles: ["prod-rocm-wsl"]
    build:
      <<: *prod-build
      args:
        GPU_EXTRA: rocm
        ROCM_WSL: "1"
      target: pytorch-prod
    container_name: oncolearn-prod-rocm-wsl
    mem_limit: 20g        # cap below WSL limit so OOM kills container, not WSL
    memswap_limit: 22g    # allow some swap headroom during model loading
    volumes:
      - ./data:/workspace/data:ro
      - ./data/configs:/workspace/data/configs
      - ./models:/workspace/models
      - ./outputs:/workspace/outputs
      - ./.hf-cache:/root/.cache/huggingface
      - ./src:/workspace/src
      - /usr/lib/wsl:/usr/lib/wsl:ro  # WSL GPU libraries
      - /usr/lib/wsl/lib/libdxcore.so:/usr/lib/libdxcore.so:ro  # ROCm needs this exact path
      - /opt/rocm/lib:/opt/rocm/lib:ro  # ROCm runtime libs (libroctx64, etc.)
    environment:
      - LD_LIBRARY_PATH=/opt/rocm/lib:/usr/lib/wsl/lib
      - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
    devices:
      - /dev/dxg  # WSL2 DirectX Graphics device for GPU passthrough
    group_add:
      - video
    cap_add:
      - SYS_PTRACE  # required for ROCm GPU topology discovery
    security_opt:
      - seccomp:unconfined  # required for ROCm HSA runtime
    ipc: host  # required for ROCm shared memory
    shm_size: '2gb'  # DataLoader workers use /dev/shm; counts within mem_limit

volumes:
  uv-cache:
  renv-cache:

# OncoLearn experiment config: TCGA-BRCA tabular-only (gene expression)
#
# Uses only the gene modality (miRNA + PAM50 + RNA-seq data).
# No imaging data or image checkpoint required.

model:
  name: oncolearn.model.multimodal.gated_late_fusion
  num_stage_classes: 5
  num_subtype_classes: 0
  freeze_encoders: true
  dropout: 0.2
  modality_dropout_prob: 0.0
  encoders:
    - name: oncolearn.encoder.multimodal.RNABERTEncoder
      modality: oncolearn.modality.gene
      output_dim: 128

data:
  base_directory: data/xenabrowser
  cohort_code: TCGA-BRCA
  splits_dir: null
  modalities:
    - name: oncolearn.modality.gene
      join_on: patient_id
      join_strategy: inner
      files:
        - TCGA-BRCA.mirna.tsv
        - TCGA-BRCA.star_tpm.tsv

training:
  max_epochs: 50
  batch_size: 16
  num_workers: 4
  accelerator: auto
  devices: 1
  early_stopping_patience: 10
  subtype_lambda: 0.3
  seed: 42
  use_class_weights: true

  optimizer:
    name: torch.optim.AdamW
    params:
      lr: 0.0001
      weight_decay: 0.00001

  scheduler:
    name: torch.optim.lr_scheduler.CosineAnnealingLR
    params:
      T_max: null
    monitor: val_loss
    interval: epoch
    frequency: 1

  loss:
    name: torch.nn.CrossEntropyLoss
    params: {}

  regularization:
    l1_lambda: 0.0
    gradient_clip_val: 0.0
    label_smoothing: 0.0

  # Uncomment to enable Optuna hyperparameter search before the final training run.
  # hpo:
  #   n_trials: 30
  #   epochs_per_trial: 10        # reduced epoch budget per trial
  #   study_name: brca_tabular_hpo
  #   storage: sqlite:///outputs/hpo.db   # omit for in-memory (non-persistent)

model:
  name: oncolearn.model.multimodal.gated_late_fusion
  num_stage_classes: 4
  num_subtype_classes: 0
  freeze_encoders: true
  dropout: 0.2
  modality_dropout_prob: 0.1
  encoders:
    - name: oncolearn.encoder.multimodal.FTTransformerEncoder
      modality: oncolearn.modality.clinical
      output_dim: 64
    - name: oncolearn.encoder.multimodal.RNABERTEncoder
      modality: oncolearn.modality.gene
      output_dim: 128
    - name: oncolearn.encoder.multimodal.FTTransformerEncoder
      modality: oncolearn.modality.cnv
      output_dim: 64
    - name: oncolearn.encoder.multimodal.FTTransformerEncoder
      modality: oncolearn.modality.protein
      output_dim: 64
    - name: oncolearn.encoder.multimodal.MRMGHierarchicalImageEncoder
      modality: oncolearn.modality.image
      output_dim: 256
      checkpoint_path: /workspace/models/breast_MR_checkpoint.pth.tar

data:
  pipeline: data/configs/modeling/multimodal/preprocessing/tcga_brca_cbioportal.py
  splits_dir: data/configs/BRCA/kfold/fold_0

training:
  max_epochs: 50
  batch_size: 16
  num_workers: 4
  accelerator: auto
  devices: 1
  early_stopping_patience: 10
  subtype_lambda: 0.3
  seed: 42
  use_class_weights: true

  optimizer:
    name: torch.optim.AdamW
    params:
      lr: 1.0e-3
      weight_decay: 1.0e-5

  scheduler:
    name: torch.optim.lr_scheduler.CosineAnnealingLR
    params:
      T_max: null
    monitor: val_loss
    interval: epoch
    frequency: 1

  loss:
    name: torch.nn.CrossEntropyLoss
    params: {}

  regularization:
    l1_lambda: 0.0
    gradient_clip_val: 1.0
    label_smoothing: 0.0

output:
  dir: outputs
  experiment_name: tcga_brca_cbioportal
  save_every_n_epochs: 5

# OncoLearn experiment config: TCGA-BRCA tabular-only (gene expression)
#
# Uses only the gene modality (miRNA + PAM50 + RNA-seq data).
# No imaging data or image checkpoint required.

model:
  name: oncolearn.model.multimodal.gated_late_fusion
  num_stage_classes: 5
  num_subtype_classes: 0
  freeze_encoders: true
  dropout: 0.2
  modality_dropout_prob: 0.0
  encoders:
    - name: oncolearn.encoder.multimodal.RNABERTEncoder
      modality: oncolearn.modality.gene
      output_dim: 128

data:
  base_directory: data/xenabrowser
  cohort_code: TCGA-BRCA
  splits_dir: null
  modalities:
    - name: oncolearn.modality.gene
      join_on: patient_id
      join_strategy: inner
      files:
        - TCGA-BRCA.mirna.tsv
        - pam50.tsv
        - TCGA-BRCA.star_counts.tsv
        - TCGA-BRCA.star_fpkm.tsv
        - TCGA-BRCA.star_fpkm-uq.tsv
        - TCGA-BRCA.star_tpm.tsv

training:
  max_epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.00001
  batch_size: 16
  num_workers: 4
  accelerator: auto
  devices: 1
  early_stopping_patience: 10
  subtype_lambda: 0.3
  scheduler: cosine
  seed: 42
  use_class_weights: true

output:
  dir: outputs
  experiment_name: tcga_brca_tabular_only
  save_every_n_epochs: 5

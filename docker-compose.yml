# Shared configuration using YAML anchors
x-common-config: &common-config
  volumes:
    - .:/workspace
    - uv-cache:/root/.cache/uv
    - renv-cache:/workspace/renv
  environment:
    - LLVM_CONFIG=/usr/bin/llvm-config-20
    - CMAKE_PREFIX_PATH=/usr/lib/llvm-20
    - JAVA_TOOL_OPTIONS=-Djava.awt.headless=true
  stdin_open: true
  tty: true

x-dev-build: &dev-build
  context: .
  dockerfile: docker/Dockerfile.dev

x-prod-build: &prod-build
  context: .
  dockerfile: docker/Dockerfile.prod

services:
  # Main development environment with Python + R (CPU only)
  dev-cpu:
    <<: *common-config
    image: ghcr.io/collaborativebioinformatics/oncolearn-dev:cpu
    profiles: ["dev-cpu"]
    build:
      <<: *dev-build
      args:
        GPU_EXTRA: cpu
      target: dev
    container_name: oncolearn-dev-cpu

  # Main development environment with Python + R (NVIDIA GPU)
  dev-nvidia:
    <<: *common-config
    image: ghcr.io/collaborativebioinformatics/oncolearn-dev:cuda
    profiles: ["dev-nvidia"]
    build:
      <<: *dev-build
      args:
        GPU_EXTRA: cu130
      target: dev
    container_name: oncolearn-dev-nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Main development environment with Python + R (AMD GPU - Native Linux)
  dev-amd:
    <<: *common-config
    image: ghcr.io/collaborativebioinformatics/oncolearn-dev:rocm
    profiles: ["dev-amd"]
    build:
      <<: *dev-build
      args:
        GPU_EXTRA: rocm
      target: dev
    container_name: oncolearn-dev-amd
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video

  # Main development environment with Python + R (AMD GPU - WSL2)
  dev-amd-wsl:
    <<: *common-config
    image: ghcr.io/collaborativebioinformatics/oncolearn-dev:rocm
    profiles: ["dev-amd-wsl"]
    build:
      <<: *dev-build
      args:
        GPU_EXTRA: rocm
      target: dev
    container_name: oncolearn-dev-amd-wsl
    volumes:
      - .:/workspace
      - uv-cache:/root/.cache/uv
      - renv-cache:/workspace/renv
      - /usr/lib/wsl:/usr/lib/wsl:ro          # WSL GPU libraries
      - /opt/rocm/lib:/opt/rocm/lib:ro         # ROCm runtime libs (libroctx64, etc.)
    environment:
      - LLVM_CONFIG=/usr/bin/llvm-config-20
      - CMAKE_PREFIX_PATH=/usr/lib/llvm-20
      - JAVA_TOOL_OPTIONS=-Djava.awt.headless=true
      - LD_LIBRARY_PATH=/opt/rocm/lib:/usr/lib/wsl/lib
      - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
    devices:
      - /dev/dxg  # WSL2 DirectX Graphics device for GPU passthrough
    group_add:
      - video
    cap_add:
      - SYS_PTRACE  # required for ROCm GPU topology discovery
    security_opt:
      - seccomp:unconfined  # required for ROCm HSA runtime
    ipc: host  # required for ROCm shared memory
    shm_size: '2gb'

  # Production PyTorch environment (CPU only)
  pytorch-prod-cpu:
    image: ghcr.io/collaborativebioinformatics/oncolearn-prod:cpu
    profiles: ["prod-cpu"]
    build:
      <<: *prod-build
      args:
        GPU_EXTRA: cpu
      target: pytorch-prod
    container_name: oncolearn-pytorch-prod-cpu
    volumes:
      - ./data:/workspace/data:ro
      - ./data/configs:/workspace/data/configs

  # Production PyTorch environment (NVIDIA GPU - Optimized Size)
  pytorch-prod-nvidia:
    image: ghcr.io/collaborativebioinformatics/oncolearn-prod:cuda
    profiles: ["prod-nvidia"]
    build:
      <<: *prod-build
      args:
        GPU_EXTRA: cu130
      target: pytorch-prod
    container_name: oncolearn-pytorch-prod-nvidia
    volumes:
      - ./data:/workspace/data:ro
      - ./data/configs:/workspace/data/configs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Production PyTorch environment (AMD GPU - WSL2)
  pytorch-prod-amd-wsl:
    image: ghcr.io/collaborativebioinformatics/oncolearn-prod:rocm-wsl
    profiles: ["prod-amd"]
    build:
      <<: *prod-build
      args:
        GPU_EXTRA: rocm
        ROCM_WSL: "1"
      target: pytorch-prod
    container_name: oncolearn-pytorch-prod-amd
    mem_limit: 20g        # cap below WSL limit so OOM kills container, not WSL
    memswap_limit: 22g    # allow some swap headroom during model loading
    volumes:
      - ./data:/workspace/data:ro
      - ./data/configs:/workspace/data/configs
      - ./models:/workspace/models
      - ./outputs:/workspace/outputs
      - ./.hf-cache:/root/.cache/huggingface
      - ./src:/workspace/src
      - /usr/lib/wsl:/usr/lib/wsl:ro  # WSL GPU libraries
      - /usr/lib/wsl/lib/libdxcore.so:/usr/lib/libdxcore.so:ro  # ROCm needs this exact path
      - /opt/rocm/lib:/opt/rocm/lib:ro  # ROCm runtime libs (libroctx64, etc.)
    environment:
      - LD_LIBRARY_PATH=/opt/rocm/lib:/usr/lib/wsl/lib
      - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
    devices:
      - /dev/dxg  # WSL2 DirectX Graphics device for GPU passthrough
    group_add:
      - video
    cap_add:
      - SYS_PTRACE  # required for ROCm GPU topology discovery
    security_opt:
      - seccomp:unconfined  # required for ROCm HSA runtime
    ipc: host  # required for ROCm shared memory
    shm_size: '2gb'  # DataLoader workers use /dev/shm; counts within mem_limit

volumes:
  uv-cache:
  renv-cache:
